<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Performance & Module Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-bold text-indigo-400">Web Performance & Module Analyzer</h1>
      <p class="text-slate-400 text-sm mt-1">Client-side performance & resource timing analyzer powered by Lighthouse API</p>
    </header>

    <div class="space-y-3">
      <input id="apiKeyInput" type="text" placeholder="Google PageSpeed API Key (optional)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
      
      <div class="flex gap-3">
        <input id="urlInput" type="url" list="urlHistoryList" placeholder="https://example.com" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
        <datalist id="urlHistoryList"></datalist>

        <button onclick="analyzeUrl()" id="analyzeBtn" class="bg-indigo-600 hover:bg-indigo-500 font-medium px-6 py-2 rounded-lg transition">Analyse starten</button>
      </div>
    </div>

    <div id="loading" class="hidden text-center py-12 text-slate-400">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-3"></div>
      <p>Analyse läuft... Das kann bis zu 30 Sekunden dauern.</p>
    </div>

    <div id="results" class="hidden space-y-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="vitalsGrid"></div>

      <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
        <h2 class="text-xl font-semibold text-slate-200 mb-4">Modul- & Ressourcen-Ladezeiten</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="text-slate-400 border-b border-slate-700">
              <tr>
                <th class="pb-2">Ressource / Pfad</th>
                <th class="pb-2">Typ</th>
                <th class="pb-2">Größe</th>
                <th class="pb-2">Dauer</th>
              </tr>
            </thead>
            <tbody id="resourceTable" class="divide-y divide-slate-700/50"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Constants for localStorage keys
    const API_KEY_STORAGE     = 'psi_api_key';
    const URL_HISTORY_STORAGE = 'psi_url_history';
    const HARDCODED_API_KEY   = 'AIzaSyCA6f2h1M-CN2-voPDEyikckgvGxzuRhG4';

    // Load saved settings and populate datalist on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem(API_KEY_STORAGE);
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
      }
      
      refreshUrlHistory();
    });

    // Populate datalist and auto-fill last searched URL
    function refreshUrlHistory() {
      const history = JSON.parse(localStorage.getItem(URL_HISTORY_STORAGE) || '[]');
      const datalist = document.getElementById('urlHistoryList');
      const urlInput = document.getElementById('urlInput');

      datalist.innerHTML = '';
      history.forEach(url => {
        const option = document.createElement('option');
        option.value = url;
        datalist.appendChild(option);
      });

      // Automatically fill the most recently used URL if input is empty
      if (history.length > 0 && !urlInput.value) {
        urlInput.value = history[0];
      }
    }

    // Save analyzed URL to history array in localStorage
    function saveUrlToHistory(url) {
      let history = JSON.parse(localStorage.getItem(URL_HISTORY_STORAGE) || '[]');
      
      // Deduplicate and place latest URL at top
      history = history.filter(item => item !== url);
      history.unshift(url);

      // Keep only last 15 entries
      if (history.length > 15) {
        history.pop();
      }

      localStorage.setItem(URL_HISTORY_STORAGE, JSON.stringify(history));
      refreshUrlHistory();
    }

    async function analyzeUrl() {
      const urlInput = document.getElementById('urlInput').value.trim();
      const apiKey = document.getElementById('apiKeyInput').value.trim() || HARDCODED_API_KEY;
      const loading = document.getElementById('loading');
      const results = document.getElementById('results');
      const analyzeBtn = document.getElementById('analyzeBtn');

      if (!urlInput) {
        alert('Bitte eine gültige URL eingeben (inkl. https://)');
        return;
      }

      // Store current key and URL in localStorage
      if (apiKey) {
        localStorage.setItem(API_KEY_STORAGE, apiKey);
      }
      saveUrlToHistory(urlInput);

      loading.classList.remove('hidden');
      results.classList.add('hidden');
      analyzeBtn.disabled = true;

      try {
        let apiEndpoint = `https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${encodeURIComponent(urlInput)}&category=PERFORMANCE`;
        if (apiKey) {
          apiEndpoint += `&key=${encodeURIComponent(apiKey)}`;
        }

        const response = await fetch(apiEndpoint);
        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message);
        }

        const audits = data.lighthouseResult.audits;
        renderVitals(audits);
        renderResources(audits['network-requests']);
        
        results.classList.remove('hidden');
      } catch (err) {
        alert('Analyse fehlgeschlagen: ' + err.message);
      } finally {
        loading.classList.add('hidden');
        analyzeBtn.disabled = false;
      }
    }

    function renderVitals(audits) {
      const vitalsGrid = document.getElementById('vitalsGrid');
      vitalsGrid.innerHTML = '';

      const keyMetrics = [
        { id: 'first-contentful-paint', label: 'FCP' },
        { id: 'largest-contentful-paint', label: 'LCP' },
        { id: 'total-blocking-time', label: 'TBT' },
        { id: 'cumulative-layout-shift', label: 'CLS' }
      ];

      keyMetrics.forEach(metric => {
        const audit = audits[metric.id];
        if (!audit) return;

        const card = document.createElement('div');
        card.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700';
        card.innerHTML = `
          <div class="text-xs text-slate-400 font-medium">${metric.label}</div>
          <div class="text-2xl font-bold text-indigo-400 mt-1">${audit.displayValue || 'N/A'}</div>
          <div class="text-xs text-slate-500 mt-1 truncate">${audit.title}</div>
        `;
        vitalsGrid.appendChild(card);
      });
    }

    function getResourceDuration(item) {
      if (typeof item.duration === 'number') {
        return Math.round(item.duration);
      }
      const start = item.startTime ?? item.networkRequestTime ?? item.rendererStartTime;
      const end = item.endTime ?? item.finishedTime ?? item.networkEndTime;
      
      if (typeof start === 'number' && typeof end === 'number') {
        return Math.max(0, Math.round(end - start));
      }
      return 0;
    }

    function renderResources(networkAudit) {
      const tbody = document.getElementById('resourceTable');
      tbody.innerHTML = '';

      if (!networkAudit || !networkAudit.details || !networkAudit.details.items) {
        tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-slate-500">Keine detaillierten Netzwerkdaten verfügbar</td></tr>';
        return;
      }

      const items = networkAudit.details.items;
      items.sort((a, b) => getResourceDuration(b) - getResourceDuration(a));

      items.forEach(item => {
        const row = document.createElement('tr');
        
        let fileName = 'Unbekannt';
        let parentPath = '';
        try {
          const parsed = new URL(item.url);
          const pathSegments = parsed.pathname.split('/').filter(Boolean);
          fileName = pathSegments.pop() || parsed.hostname;
          parentPath = parsed.hostname + (pathSegments.length > 0 ? '/' + pathSegments.join('/') + '/' : '/');
        } catch (e) {
          fileName = item.url;
        }

        const sizeKb = item.transferSize ? (item.transferSize / 1024).toFixed(1) : '0.0';
        const durationMs = getResourceDuration(item);

        row.innerHTML = `
          <td class="py-3 max-w-md truncate" title="${item.url}">
            <div class="text-[10px] text-slate-500 font-mono truncate">${parentPath}</div>
            <div class="font-mono text-xs text-indigo-300 font-medium truncate">${fileName}</div>
          </td>
          <td class="py-3 text-slate-400 text-xs">${item.resourceType || 'Sonstige'}</td>
          <td class="py-3 text-slate-300">${sizeKb} KB</td>
          <td class="py-3 text-slate-300 font-semibold">${durationMs} ms</td>
        `;
        tbody.appendChild(row);
      });
    }
  </script>
</body>
</html>
